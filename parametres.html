<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Paramètres USSD — Mvola</title>
  <link rel="manifest" href="/manifest.json">
  <link href="/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <style>
    :where([class^="ri-"])::before { content: "\f3c2"; }
    body { background-color: #f9fafb; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    aside { z-index: 40; }
    main { min-height: 100vh; }
    .bg-primary { background-color: rgb(59 130 246); }
    .text-primary { color: rgb(59 130 246); }
    .focus\:ring-primary:focus { --tw-ring-color: rgb(59 130 246); }
    .focus\:border-primary:focus { border-color: rgb(59 130 246); }
    .hover\:text-primary:hover { color: rgb(59 130 246); }
    .nav-link.active { background-color: rgb(239 246 255); color: rgb(59 130 246); }
    .nav-link.active .w-5 { color: rgb(59 130 246); }
    .pattern-input { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.8125rem; }
  </style>
</head>
<body class="min-h-screen flex relative">
  <div id="overlay" class="fixed inset-0 bg-black opacity-50 z-30 hidden lg:hidden"></div>

  <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 shadow-sm transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-gray-100">
      <a href="/" class="font-['Pacifico'] text-2xl text-primary">Mvola</a>
      <button id="closeSidebar" type="button" class="text-gray-500 hover:text-gray-700 lg:hidden" aria-label="Fermer le menu">
        <div class="w-5 h-5 flex items-center justify-center"><i class="ri-close-line"></i></div>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto p-3 space-y-1">
      <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-gray-400">Fonctionnalités</p>

      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-exchange-line"></i></div>
        Transfert
      </a>
      <a href="/depot.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-add-circle-line"></i></div>
        Dépôt
      </a>
      <a href="/retrait.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-hand-coin-line"></i></div>
        Retrait
      </a>
      <a href="/epargne.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-safe-2-line"></i></div>
        Épargne
      </a>
      <a href="/solde.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-wallet-3-line"></i></div>
        Solde
      </a>
      <a href="/transactions.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-file-list-3-line"></i></div>
        Transactions
      </a>

      <div class="my-3 border-t border-gray-100"></div>

      <a href="/parametres.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-settings-3-line"></i></div>
        Paramètres
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100 text-xs text-gray-400">Paramètres USSD</div>
  </aside>

  <main class="flex-1 lg:ml-64">
    <div class="flex items-center justify-between p-4 lg:hidden bg-white shadow-sm">
      <button id="openSidebar" class="text-gray-500 hover:text-gray-700">
        <div class="w-5 h-5 flex items-center justify-center"><i class="ri-menu-line"></i></div>
      </button>
      <h1 class="font-['Pacifico'] text-xl text-primary">Mvola</h1>
      <div class="w-5"></div>
    </div>
    
    <div class="max-w-2xl mx-auto p-4 lg:p-6 my-4 lg:my-8">
      <header class="mb-6 text-center lg:text-left">
        <h1 class="text-2xl font-bold text-gray-800">Paramètres des codes USSD</h1>
        <p class="text-gray-600 text-sm mt-1">Modifiez les modèles de code pour chaque fonctionnalité. Utilisez <code class="bg-gray-100 px-1 rounded text-xs">{phone}</code> et <code class="bg-gray-100 px-1 rounded text-xs">{amount}</code>.</p>
      </header>

      <form id="patternsForm" class="space-y-4"></form>

      <div class="sticky bottom-0 bg-gray-50/95 backdrop-blur border-t border-gray-200 -mx-4 px-4 py-4 mt-6 flex flex-wrap gap-3">
        <button type="button" id="saveBtn" class="flex-1 min-w-[140px] bg-primary hover:bg-primary/90 text-white py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
          <i class="ri-save-line"></i>
          Enregistrer
        </button>
        <button type="button" id="resetBtn" class="flex-1 min-w-[140px] bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 py-2.5 px-4 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
          <i class="ri-refresh-line"></i>
          Réinitialiser
        </button>
      </div>

      <p id="saveMessage" class="text-green-600 text-sm text-center mt-3 hidden">Paramètres enregistrés.</p>
    </div>
  </main>

  <script src="/js/ussd-patterns.js"></script>
  <script>
    const DOM = {
      form: document.getElementById('patternsForm'),
      saveBtn: document.getElementById('saveBtn'),
      resetBtn: document.getElementById('resetBtn'),
      saveMessage: document.getElementById('saveMessage'),
      openSidebarBtn: document.getElementById('openSidebar'),
      closeSidebarBtn: document.getElementById('closeSidebar'),
      overlay: document.getElementById('overlay'),
      sidebar: document.querySelector('aside')
    };

    function renderForm(patterns) {
      DOM.form.innerHTML = '';
      MvolaPatterns.META.forEach(function (group) {
        const section = document.createElement('section');
        section.className = 'bg-white shadow-lg rounded-lg p-4 lg:p-5 space-y-4';
        section.innerHTML = `
          <div class="flex items-center gap-2 border-b border-gray-100 pb-3">
            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-primary">
              <i class="${group.icon}"></i>
            </div>
            <h2 class="text-lg font-medium text-gray-800">${group.group}</h2>
          </div>
        `;
        const fields = document.createElement('div');
        fields.className = 'space-y-4';
        group.items.forEach(function (item) {
          const wrap = document.createElement('div');
          wrap.className = 'space-y-1.5';
          wrap.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <label for="pattern_${item.key}" class="block text-sm font-medium text-gray-700">${item.label}</label>
              <span class="text-xs text-gray-400">${item.hint}</span>
            </div>
            <input type="text" id="pattern_${item.key}" name="${item.key}"
              class="pattern-input block w-full py-2 px-3 border border-gray-300 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
              value="${(patterns[item.key] || '').replace(/"/g, '&quot;')}"
              spellcheck="false" autocomplete="off">
            <button type="button" class="text-xs text-primary hover:underline restore-default" data-key="${item.key}">
              Restaurer la valeur par défaut
            </button>
          `;
          fields.appendChild(wrap);
        });
        section.appendChild(fields);
        DOM.form.appendChild(section);
      });
    }

    function collectPatterns() {
      const patterns = {};
      Object.keys(MvolaPatterns.DEFAULTS).forEach(function (key) {
        const input = document.getElementById('pattern_' + key);
        patterns[key] = input ? input.value.trim() : MvolaPatterns.DEFAULTS[key];
      });
      return patterns;
    }

    function openSidebar() {
      DOM.sidebar.classList.remove('-translate-x-full');
      DOM.overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      DOM.sidebar.classList.add('-translate-x-full');
      DOM.overlay.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function initApp() {
      renderForm(MvolaPatterns.getPatterns());

      DOM.form.addEventListener('click', function (e) {
        const btn = e.target.closest('.restore-default');
        if (!btn) return;
        const key = btn.getAttribute('data-key');
        const input = document.getElementById('pattern_' + key);
        if (input) input.value = MvolaPatterns.DEFAULTS[key];
      });

      DOM.saveBtn.addEventListener('click', function () {
        MvolaPatterns.savePatterns(collectPatterns());
        DOM.saveMessage.classList.remove('hidden');
        setTimeout(function () { DOM.saveMessage.classList.add('hidden'); }, 2500);
      });

      DOM.resetBtn.addEventListener('click', function () {
        if (!confirm('Réinitialiser tous les patterns aux valeurs par défaut ?')) return;
        renderForm(MvolaPatterns.resetPatterns());
        DOM.saveMessage.textContent = 'Patterns réinitialisés.';
        DOM.saveMessage.classList.remove('hidden');
        setTimeout(function () {
          DOM.saveMessage.classList.add('hidden');
          DOM.saveMessage.textContent = 'Paramètres enregistrés.';
        }, 2500);
      });

      DOM.openSidebarBtn.addEventListener('click', openSidebar);
      DOM.closeSidebarBtn.addEventListener('click', closeSidebar);
      DOM.overlay.addEventListener('click', closeSidebar);

      window.addEventListener('resize', function () {
        if (window.innerWidth >= 1024) closeSidebar();
      });

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
