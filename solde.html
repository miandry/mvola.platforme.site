<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Solde Mvola — Générateur de Code</title>
  <link rel="manifest" href="/manifest.json">
  <link href="/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  
  <style>
    :where([class^="ri-"])::before { content: "\f3c2"; }
    body { background-color: #f9fafb; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    aside { z-index: 40; }
    main { min-height: 100vh; }
    .bg-primary { background-color: rgb(59 130 246); }
    .text-primary { color: rgb(59 130 246); }
    .focus\:ring-primary:focus { --tw-ring-color: rgb(59 130 246); }
    .focus\:border-primary:focus { border-color: rgb(59 130 246); }
    .hover\:text-primary:hover { color: rgb(59 130 246); }
    .nav-link.active { background-color: rgb(239 246 255); color: rgb(59 130 246); }
    .nav-link.active .w-5 { color: rgb(59 130 246); }
  </style>
</head>
<body class="min-h-screen flex relative">
  <div id="overlay" class="fixed inset-0 bg-black opacity-50 z-30 hidden lg:hidden"></div>

  <aside class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 shadow-sm transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-gray-100">
      <a href="/" class="font-['Pacifico'] text-2xl text-primary">Mvola</a>
      <button id="closeSidebar" type="button" class="text-gray-500 hover:text-gray-700 lg:hidden" aria-label="Fermer le menu">
        <div class="w-5 h-5 flex items-center justify-center"><i class="ri-close-line"></i></div>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto p-3 space-y-1">
      <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-gray-400">Fonctionnalités</p>

      <a href="/" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-exchange-line"></i></div>
        Transfert
      </a>
      <a href="/depot.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-add-circle-line"></i></div>
        Dépôt
      </a>
      <a href="/retrait.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-hand-coin-line"></i></div>
        Retrait
      </a>
      <a href="/epargne.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-safe-2-line"></i></div>
        Épargne
      </a>
      <a href="/solde.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-wallet-3-line"></i></div>
        Solde
      </a>
      <a href="/transactions.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-file-list-3-line"></i></div>
        Transactions
      </a>

      <div class="my-3 border-t border-gray-100"></div>
      <p class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-gray-400">Compte</p>

      <a href="#mvola" data-account="mvola" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-smartphone-line"></i></div>
        Compte Mvola
      </a>
      <a href="#epargne" data-account="epargne" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-blue-50 hover:text-primary transition">
        <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-safe-2-line"></i></div>
        Compte Épargne
      </a>
    </nav>

    <div class="p-4 border-t border-gray-100 text-xs text-gray-400">Solde Mvola — USSD</div>
  </aside>

  <main class="flex-1 lg:ml-64">
    <div class="flex items-center justify-between p-4 lg:hidden bg-white shadow-sm">
      <button id="openSidebar" class="text-gray-500 hover:text-gray-700">
        <div class="w-5 h-5 flex items-center justify-center"><i class="ri-menu-line"></i></div>
      </button>
      <h1 class="font-['Pacifico'] text-xl text-primary">Mvola</h1>
      <div class="w-5"></div>
    </div>
    
    <div id="generer" class="max-w-md mx-auto p-4 lg:p-6 bg-white shadow-lg rounded-lg my-4 lg:my-8">
      <header class="mb-6 text-center">
        <div class="mx-auto mb-3 w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center text-primary">
          <i class="ri-wallet-3-line text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Consulter le solde</h1>
        <p class="text-gray-600 text-sm mt-1">Vérifiez le solde de votre compte Mvola ou Épargne</p>
      </header>
      
      <form id="codeForm" class="space-y-6">
        <div class="space-y-2">
          <label for="accountType" class="block text-sm font-medium text-gray-700">Compte</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-bank-line"></i></div>
            </div>
            <select id="accountType" class="block w-full pl-10 pr-8 py-2 border border-gray-300 rounded-button text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary appearance-none bg-white">
              <option value="mvola">Compte Mvola</option>
              <option value="epargne">Compte Épargne</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
              <div class="w-5 h-5 flex items-center justify-center text-gray-400"><i class="ri-arrow-down-s-line"></i></div>
            </div>
          </div>
        </div>
        
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">Code USSD</label>
          <div class="relative">
            <input type="text" id="result" class="block w-full pr-20 py-3 px-3 bg-gray-50 border border-gray-300 rounded-button text-gray-800 font-medium text-center text-lg focus:outline-none" readonly>
            <div class="absolute inset-y-0 right-0 flex items-center">
              <button type="button" id="copyBtn" class="px-3">
                <div class="w-5 h-5 flex items-center justify-center text-gray-500 hover:text-primary"><i class="ri-file-copy-line"></i></div>
              </button>
            </div>
          </div>
          <p id="copyMessage" class="text-green-500 text-xs text-center hidden">Copié dans le presse-papiers!</p>
        </div>
        
        <button type="button" id="callBtn" class="w-full bg-primary hover:bg-primary/90 text-white py-3 px-4 rounded-button shadow-sm transition flex items-center justify-center gap-2">
          <i class="ri-phone-line"></i>
          Composer le code
        </button>

        <p id="hint" class="text-xs text-gray-500 text-center">Vous recevrez votre solde par SMS après composition.</p>
      </form>
    </div>
  </main>

  <script>
    const CODES = {
      mvola: '#111*1*1#',
      epargne: '#111*1*3*1*3#'
    };

    const DOM = {
      accountSelect: document.getElementById('accountType'),
      resultInput: document.getElementById('result'),
      callBtn: document.getElementById('callBtn'),
      copyBtn: document.getElementById('copyBtn'),
      copyMessage: document.getElementById('copyMessage'),
      openSidebarBtn: document.getElementById('openSidebar'),
      closeSidebarBtn: document.getElementById('closeSidebar'),
      overlay: document.getElementById('overlay'),
      sidebar: document.querySelector('aside')
    };

    function updateCode() {
      const type = DOM.accountSelect.value;
      DOM.resultInput.value = CODES[type];
      document.querySelectorAll('nav a.nav-link[data-account]').forEach((link) => {
        link.classList.toggle('active', link.getAttribute('data-account') === type);
      });
    }

    function copyToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function openSidebar() {
      DOM.sidebar.classList.remove('-translate-x-full');
      DOM.overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      DOM.sidebar.classList.add('-translate-x-full');
      DOM.overlay.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function initApp() {
      updateCode();
      DOM.accountSelect.addEventListener('change', updateCode);

      DOM.callBtn.addEventListener('click', () => {
        window.location.href = `tel:${DOM.resultInput.value}`;
      });

      DOM.copyBtn.addEventListener('click', () => {
        copyToClipboard(DOM.resultInput.value);
        DOM.copyMessage.classList.remove('hidden');
        setTimeout(() => DOM.copyMessage.classList.add('hidden'), 2000);
      });

      DOM.openSidebarBtn.addEventListener('click', openSidebar);
      DOM.closeSidebarBtn.addEventListener('click', closeSidebar);
      DOM.overlay.addEventListener('click', closeSidebar);

      document.querySelectorAll('nav a.nav-link[data-account]').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          DOM.accountSelect.value = link.getAttribute('data-account');
          updateCode();
          if (window.innerWidth < 1024) closeSidebar();
        });
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth >= 1024) closeSidebar();
      });

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
